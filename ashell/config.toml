# Ashell Configuration
# https://malpenzibo.github.io/ashell/docs/configuration

# Main settings
outputs = "All"
position = "Top"

# Module layout
[modules]
left = ["appLauncher","Workspaces", "WindowTitle"]
center = ["MediaPlayer"]
right = ["SystemInfo", ["Tray", "notifications", "KeyboardLayout", "Clock", "Settings"]]

# Settings module
[settings]
lock_cmd = "hyprlock &"
shutdown_cmd = "shutdown now"
suspend_cmd = "systemctl suspend"
reboot_cmd = "systemctl reboot"
logout_cmd = "loginctl kill-user $(whoami)"

audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "blueman-manager"

indicators = ["Battery", "Bluetooth", "Network", "Audio"]
battery_format = "IconAndPercentage"

# Clock settings
[clock]
format = "%a %b %d  %H:%M"

# Keyboard layout labels (for fcitx5 IME)
[keyboard_layout.labels]
"English (US)" = "EN"
"Japanese" = "JP"

# Appearance settings
[appearance]
scale_factor = 1.3

# Custom modules
[[CustomModule]]
name = "notifications"
icon = "󰂚"
command = "swaync-client -t"
